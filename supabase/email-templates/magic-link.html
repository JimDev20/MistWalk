<!doctype html>
<html lang="en">
	<body style="margin: 0; padding: 0; background: #04090f; color: #e9f2f8">
		<div
			style="
				max-width: 520px;
				margin: 0 auto;
				padding: 40px 24px;
				font-family: 'Segoe UI', Arial, sans-serif;
			"
		>
			<p
				style="
					margin: 0 0 12px;
					color: #67e8f9;
					font-size: 12px;
					letter-spacing: 0.18em;
					text-transform: uppercase;
				"
			>
				MistWalk
			</p>
			<h1 style="margin: 0 0 14px; font-size: 28px; line-height: 1.15; font-weight: 500">
				Your sign-in code
			</h1>
			<p style="margin: 0 0 24px; color: #8198a9; font-size: 15px; line-height: 1.6">
				Enter this 6-digit code on the MistWalk website. There is no link to click.
			</p>
			<p
				style="
					margin: 0 0 24px;
					padding: 18px 20px;
					border: 1px solid rgba(157, 200, 238, 0.24);
					border-radius: 10px;
					background: #07111b;
					color: #e9f2f8;
					font-family: Consolas, 'Courier New', monospace;
					font-size: 34px;
					font-weight: 700;
					letter-spacing: 0.28em;
					text-align: center;
				"
			>
				{{ .Token }}
			</p>
			<p style="margin: 0 0 8px; color: #8198a9; font-size: 13px; line-height: 1.6">
				The code expires shortly. If you did not request it, you can ignore this email.
			</p>
			<p style="margin: 24px 0 0; color: #5d7282; font-size: 12px; line-height: 1.6">
				After signing in, the owner still has to approve your account before the map or simulator
				unlocks.
			</p>
		</div>
	</body>
</html>
